plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    // NeoTerm keeps upstream Java/resource namespaces and JNI symbols independent of app identity.
    namespace "com.termux"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core-ktx:1.12.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation "androidx.activity:activity-ktx:1.8.2"
        implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
        implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
        implementation "androidx.lifecycle:lifecycle-service:2.7.0"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

        implementation project(":neoterm-input")
        implementation project(":cmd-translator")
        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        // Termux-compatible execution: targetSdk 28 lets binaries in the app's own prefix execve
        // (Android denies that to targetSdk 29+). Sideload only; not eligible for Google Play.
        // The identity must match termux-shared's TERMUX_PACKAGE_NAME (TermuxConstants paths).
        applicationId "com.commandroid_line"
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        versionCode 1002
        versionName "0.118.3"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.commandroid_line"
        manifestPlaceholders.TERMUX_APP_NAME = "commandroid-line"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // NeoTerm debug builds use Android's generated local debug keystore.
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }

    sourceSets {
        test.java.srcDir 'src/imeTest/kotlin'
        androidTest.java.srcDir 'src/imeTest/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'ProtectedPermissions'
        // The app deliberately targets SDK 28 (see defaultConfig).
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
        abortOnError true
        checkDependencies false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter("ABI")
                outputFileName = new File("commandroid-line_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter("ABI")
                outputFileName = new File("commandroid-line_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.12.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// Bootstraps. The app carries only one built from source for its own
// prefix (/data/data/com.commandroid_line/files/usr; see docs/neoterm/BOOTSTRAP-BUILD.md). An
// official com.termux bootstrap must never be bundled: its binaries hardcode another app's prefix.
// Pass -PcommandroidBootstrapDir=<dir with bootstrap-<arch>.zip>; the archives are packaged as
// assets under bootstrap/. Without it the app falls back to the system shell and
// says so in its runtime notice. Historical upstream native bootstrap sources remain in src/main/cpp.
abstract class StageCommandroidBootstrap extends DefaultTask {
    @Input abstract Property<String> getBootstrapDir()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void stage() {
        def out = outputDir.get().asFile
        project.delete(out)
        def target = new File(out, "bootstrap")
        target.mkdirs()
        def source = bootstrapDir.get()
        if (!source) return
        def found = 0
        ["aarch64", "arm", "i686", "x86_64"].each { arch ->
            def zip = new File(source, "bootstrap-${arch}.zip")
            if (zip.isFile()) {
                project.copy { from zip; into target }
                found++
            }
        }
        if (found == 0) throw new GradleException("commandroidBootstrapDir has no bootstrap-<arch>.zip: " + source)
    }
}

def stageBootstrap = tasks.register("stageCommandroidBootstrap", StageCommandroidBootstrap) {
    bootstrapDir = (project.findProperty("commandroidBootstrapDir") ?: "").toString()
    // Re-stage on every build: the archives may change while their directory name does not.
    outputs.upToDateWhen { false }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(stageBootstrap) { it.outputDir }
    }
}
