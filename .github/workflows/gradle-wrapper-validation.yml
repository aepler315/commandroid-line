name: Validate Gradle wrapper

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/neoterm-standalone]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
