name: NeoTerm checks and debug APK

on:
  push:
    branches: [main, feature/neoterm-standalone]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoterm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TERMUX_APP_VERSION_NAME: 0.118.3-neoterm.standalone2
      TERMUX_APK_VERSION_TAG: standalone-debug
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.3' 'ndk;22.1.7171670'
      - name: Java for NeoTerm and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Bootstrap tooling regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/bootstrap -p 'test_*.py'
      - name: JVM tests and debug APKs
        run: ./tools/neoterm-debug.sh
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoterm-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload development APKs
        uses: actions/upload-artifact@v4
        with:
          name: neoterm-standalone2-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/neoterm_standalone-debug_universal.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
